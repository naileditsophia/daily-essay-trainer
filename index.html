<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Essay Trainer</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --primary-color: #495057;
            --accent-color: #007bff;
            --border-color: #dee2e6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .nav-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            color: #6c757d;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .nav-btn.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
            font-weight: bold;
        }

        .panel {
            display: none;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .panel.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }

        /* 기록 스타일 */
        .history-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 25px;
            padding: 20px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .history-title {
            font-size: 1.4rem;
            margin: 0;
            color: #333;
        }

        .attempt-item {
            background: #f8f9fa;
            border-left: 4px solid var(--accent-color);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 4px 4px 0;
            position: relative;
        }

        .attempt-date {
            font-size: 0.85rem;
            color: #868e96;
            margin-bottom: 5px;
        }

        .content-box {
            white-space: pre-wrap;
            background: #fff;
            padding: 10px;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            margin-top: 5px;
            max-height: 200px;
            overflow-y: auto;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: flex-end;
        }

        /* 수정 모드 스타일 */
        .edit-mode input, .edit-mode textarea {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Daily Essay Trainer</h1>
        <p>사설/기사 요약 및 에세이 연습 트레이너</p>
    </header>

    <div class="nav-tabs">
        <button class="nav-btn active" onclick="switchTab('trainer')">훈련하기</button>
        <button class="nav-btn" onclick="switchTab('history')">기록 보기</button>
    </div>

    <!-- 훈련하기 패널 -->
    <div id="trainer-panel" class="panel active">
        <div class="form-group">
            <label for="article-title">기사/사설 제목</label>
            <input type="text" id="article-title" placeholder="기사 제목을 입력하세요 (같은 제목 입력 시 한 페이지에 기록이 누적됩니다)">
        </div>

        <div class="form-group">
            <label for="user-essay">나의 요약 및 에세이 작성 (현황 / 원인 / 해결방안 / 전망) </label>
            <textarea id="user-essay" rows="8" placeholder="본인의 요약문이나 에세이를 작성하세요..."></textarea>
        </div>

        <div style="border-top: 1px dashed #ccc; margin: 25px 0; padding-top: 20px;">
            <p style="color: #666; font-size: 0.9rem; margin-top: 0;">💡 <b>클로드(Claude) 활용 방법:</b> 위 에세이를 복사하여 클로드에게 채점 및 분석을 요청한 후, 아래 칸에 결과값을 붙여넣어 함께 저장하세요.</p>
        </div>

        <div class="form-group">
            <label for="claude-analysis">클로드 분석 및 채점 결과 붙여넣기</label>
            <textarea id="claude-analysis" rows="10" placeholder="클로드 가 제공한 분석 리포트, 점수, 피드백 내용을 그대로 붙여넣으세요..."></textarea>
        </div>

        <button class="btn" onclick="saveTraining()">훈련 기록 저장하기</button>
    </div>

    <!-- 기록 보기 패널 -->
    <div id="history-panel" class="panel">
        <div id="history-container">
            <!-- 자바스크립트로 기록이 동적 렌더링 됩니다 -->
        </div>
    </div>
</div>

<script>
    // 로컬 스토리지 초기화 및 데이터 로드
    let essayData = JSON.parse(localStorage.getItem('essayData')) || [];

    // 탭 전환 로직
    function switchTab(tabName) {
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));

        if (tabName === 'trainer') {
            document.querySelector("button[onclick=\"switchTab('trainer')\"]").classList.add('active');
            document.getElementById('trainer-panel').classList.add('active');
        } else {
            document.querySelector("button[onclick=\"switchTab('history')\"]").classList.add('active');
            document.getElementById('history-panel').classList.add('active');
            renderHistory();
        }
    }

    // 데이터 저장 로직
    function saveTraining() {
        const title = document.getElementById('article-title').value.trim();
        const essay = document.getElementById('user-essay').value.trim();
        const analysis = document.getElementById('claude-analysis').value.trim();

        if (!title) {
            alert('기사 제목을 입력해주세요.');
            return;
        }
        if (!essay && !analysis) {
            alert('내용을 입력해주세요.');
            return;
        }

        const newAttempt = {
            id: Date.now(),
            date: new Date().toLocaleString('ko-KR'),
            userEssay: essay,
            claudeAnalysis: analysis
        };

        // 같은 제목의 기사가 이미 존재하는지 확인
        const existingArticleIndex = essayData.findIndex(item => item.title === title);

        if (existingArticleIndex > -1) {
            // 이미 존재하면 해당 기사의 하위 시도(attempts) 배열에 추가
            essayData[existingArticleIndex].attempts.push(newAttempt);
        } else {
            // 새로 개설되는 기사 타이틀 구조
            essayData.push({
                title: title,
                attempts: [newAttempt]
            });
        }

        localStorage.setItem('essayData', JSON.stringify(essayData));
        alert('훈련 기록이 성공적으로 저장되었습니다.');

        // 입력 폼 초기화
        document.getElementById('article-title').value = '';
        document.getElementById('user-essay').value = '';
        document.getElementById('claude-analysis').value = '';

        // 기록 탭으로 이동
        switchTab('history');
    }

    // 기록 화면 렌더링 (같은 제목 그룹화 + 페이지 내 실시간 수정 기능 포함)
    function renderHistory() {
        const container = document.getElementById('history-container');
        if (essayData.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#868e96;">저장된 훈련 기록이 없습니다.</p>';
            return;
        }

        container.innerHTML = '';

        essayData.forEach((article, articleIdx) => {
            const card = document.createElement('div');
            card.className = 'history-card';
            card.id = `article-card-${articleIdx}`;

            // 카드 헤더 (제목)
            let cardHtml = `
                <div class="history-header">
                    <h3 class="history-title" id="title-display-${articleIdx}">${escapeHtml(article.title)}</h3>
                    <div class="edit-title-zone" id="title-edit-zone-${articleIdx}" style="display:none; width: 70%;">
                        <input type="text" id="input-title-${articleIdx}" value="${escapeHtml(article.title)}">
                    </div>
                    <button class="btn btn-secondary" style="padding: 6px 12px; font-size:0.85rem;" id="btn-edit-main-${articleIdx}" onclick="toggleArticleEdit(${articleIdx})">기사명/내용 수정</button>
                    <button class="btn" style="padding: 6px 12px; font-size:0.85rem; background-color:#28a745; display:none;" id="btn-save-main-${articleIdx}" onclick="saveArticleEdit(${articleIdx})">완료</button>
                </div>
            `;

            // 회차별 작성 및 분석 데이터 누적 출력
            article.attempts.forEach((attempt, attemptIdx) => {
                cardHtml += `
                    <div class="attempt-item" id="attempt-${articleIdx}-${attemptIdx}">
                        <div class="attempt-date">⏱ 훈련 일시: ${attempt.date} (${attemptIdx + 1}회차 훈련)</div>
                        
                        <div class="display-mode-${articleIdx}">
                            <strong>내 에세이:</strong>
                            <div class="content-box">${escapeHtml(attempt.userEssay) || '(입력 내용 없음)'}</div>
                            <strong style="display:block; margin-top:10px;">클로드 채점 및 분석 결과:</strong>
                            <div class="content-box" style="border-left: 3px solid #28a745;">${escapeHtml(attempt.claudeAnalysis) || '(입력 내용 없음)'}</div>
                        </div>

                        <div class="edit-mode-${articleIdx}" style="display:none; margin-top:10px;">
                            <label style="font-size:0.85rem;">내 에세이 수정:</label>
                            <textarea id="edit-essay-${articleIdx}-${attemptIdx}" rows="4">${attempt.userEssay}</textarea>
                            <label style="font-size:0.85rem; margin-top:5px;">클로드 결과 수정:</label>
                            <textarea id="edit-analysis-${articleIdx}-${attemptIdx}" rows="5">${attempt.claudeAnalysis}</textarea>
                            <button class="btn btn-secondary" style="padding: 4px 8px; font-size:0.75rem; background-color:#dc3545; margin-top:5px;" onclick="deleteAttempt(${articleIdx}, ${attemptIdx})">이 회차 삭제</button>
                        </div>
                    </div>
                `;
            });

            card.innerHTML = cardHtml;
            container.appendChild(card);
        });
    }

    // 수정 모드 토글 함수
    function toggleArticleEdit(articleIdx) {
        document.getElementById(`title-display-${articleIdx}`).style.display = 'none';
        document.getElementById(`title-edit-zone-${articleIdx}`).style.display = 'block';
        
        document.getElementById(`btn-edit-main-${articleIdx}`).style.display = 'none';
        document.getElementById(`btn-save-main-${articleIdx}`).style.display = 'inline-block';

        // 해당 카드의 모든 회차 편집 박스 노출
        document.querySelectorAll(`.display-mode-${articleIdx}`).forEach(el => el.style.display = 'none');
        document.querySelectorAll(`.edit-mode-${articleIdx}`).forEach(el => el.style.display = 'block');
    }

    // 수정 완료 및 저장 함수
    function saveArticleEdit(articleIdx) {
        const newTitle = document.getElementById(`input-title-${articleIdx}`).value.trim();
        if (!newTitle) {
            alert('기사 제목은 비워둘 수 없습니다.');
            return;
        }

        // 제목 변경 적용
        essayData[articleIdx].title = newTitle;

        // 각 회차별 수정 텍스트 내용 적용
        essayData[articleIdx].attempts.forEach((attempt, attemptIdx) => {
            const updatedEssay = document.getElementById(`edit-essay-${articleIdx}-${attemptIdx}`).value;
            const updatedAnalysis = document.getElementById(`edit-analysis-${articleIdx}-${attemptIdx}`).value;
            
            attempt.userEssay = updatedEssay;
            attempt.claudeAnalysis = updatedAnalysis;
        });

        // 빈 데이터 정리 및 로컬스토리지 저장
        localStorage.setItem('essayData', JSON.stringify(essayData));
        
        alert('수정 사항이 저장되었습니다.');
        renderHistory();
    }

    // 특정 회차 삭제 기능
    function deleteAttempt(articleIdx, attemptIdx) {
        if(confirm('정말로 이 회차의 훈련 기록을 삭제하시겠습니까?')) {
            essayData[articleIdx].attempts.splice(attemptIdx, 1);
            
            // 만약 기사 내에 아무런 회차 기록도 남아있지 않다면 기사 카드 자체를 삭제
            if(essayData[articleIdx].attempts.length === 0) {
                essayData.splice(articleIdx, 1);
            }
            
            localStorage.setItem('essayData', JSON.stringify(essayData));
            renderHistory();
        }
    }

    // XSS 방지를 위한 HTML 문자열 이스케이프 유틸 함수
    function escapeHtml(text) {
        if (!text) return '';
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
